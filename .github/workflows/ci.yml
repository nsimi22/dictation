name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      # The unit tests only exercise the pure-logic modules (text, config), so
      # we install just their dependencies instead of the heavy audio/ML stack.
      - name: Install test dependencies
        run: python -m pip install --upgrade pip PyYAML pytest

      # Byte-compile every module so syntax errors in the audio/ML code paths
      # (which the tests don't import) are still caught.
      - name: Compile all modules
        run: python -m compileall src

      - name: Run tests
        run: python -m pytest -q
        env:
          PYTHONPATH: src

  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install ruff
        run: python -m pip install ruff

      - name: Ruff
        run: ruff check src tests
